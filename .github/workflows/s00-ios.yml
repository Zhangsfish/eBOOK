name: S00 native iOS
on:
  push:
    branches: [codex/s00-reader-foundation, codex/s01-tts-voice-lab]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s00-ios-${{ github.sha }}
  cancel-in-progress: true
jobs:
  xcode:
    # Standard public-repository runner only. No paid/larger runners or signing.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate original local-only long fixture
        run: |
          python3 scripts/generate_long_gb18030_fixture.py
          python3 scripts/generate_xcode_project.py --check
      - name: Offline S01 tests and dry run (no vendor requests)
        if: ${{ hashFiles('tools/tts-lab/run.py') != '' }}
        run: |
          python3 -m unittest discover -s tools/tts-lab/tests
          mkdir -p .local-test-data/tts-auditions/ci
          python3 tools/tts-lab/run.py --dry-run --provider all > .local-test-data/tts-auditions/ci/dry-run.stdout
          echo 'Offline dry run passed. Audition outputs stay ignored and are not uploaded.'
      - name: Real Xcode build and simulator tests
        run: bash scripts/ci_xcode.sh
      - name: Upload metadata, logs and test results (no imported books or app bundle)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s00-xcode-${{ github.sha }}
          path: |
            build/*.log
            build/environment.json
            build/test-summary.json
            build/test-details.json
            build/reader-metrics.json
            build/reader-metrics-summary.json
            build/screenshots/
          retention-days: 7
