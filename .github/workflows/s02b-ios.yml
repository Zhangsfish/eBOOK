name: S02B local Suxin integration
on:
  push:
    branches: [codex/s02b-suxin-ios-integration]
    paths: ['.github/workflows/s02b-ios.yml']
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [frontend, integration, all]
        default: all
        description: Actual native frontend or complete App regression
      runner:
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
        description: Standard free GitHub-hosted macOS runner only
permissions:
  contents: read
concurrency:
  group: s02b-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.private == false
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify resources and deterministic project
        run: |
          python3 tools/suxin/scripts/prepare_resources.py
          python3 tools/suxin/scripts/inspect_runtime.py
          python3 scripts/generate_long_gb18030_fixture.py
          python3 scripts/generate_xcode_project.py --check
      - name: Real native App build and XCTest
        env:
          S02B_SCOPE: ${{ inputs.scope || 'all' }}
        run: python3 tools/suxin/scripts/ci_integration.py --scope "$S02B_SCOPE"
      - name: Upload only small original-test logs and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s02b-${{ inputs.scope || 'all' }}-${{ github.sha }}
          path: |
            build/s02b-*.log
            build/s02b-*.json
          if-no-files-found: warn
          retention-days: 7
